name: build-test

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v -o tdl .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdl-linux-amd64
          path: tdl
          retention-days: 7
